name: Publish semantic cards

on:
  push:
    branches: [main]
    tags: ['blue-packages-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-s3-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.SEMANTICS_PUBLICATION_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/blue-packages-'))
    environment: semantics-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main history and skip superseded main runs
        id: source
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [ "$SOURCE_REF" = refs/heads/main ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.source.outputs.current == 'true'
        with:
          python-version: '3.13'
      - if: steps.source.outputs.current == 'true'
        run: python -m pip install -r tools/semantic-requirements.txt
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        if: steps.source.outputs.current == 'true'
        with:
          aws-region: ${{ vars.SEMANTICS_AWS_REGION }}
          role-to-assume: ${{ vars.SEMANTICS_PUBLISH_ROLE_ARN }}
          allowed-account-ids: ${{ vars.SEMANTICS_AWS_ACCOUNT_ID }}
      - name: Publish committed cards; never generate or delete
        if: steps.source.outputs.current == 'true'
        env:
          SEMANTICS_BUCKET: ${{ vars.SEMANTICS_BUCKET }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          test -n "$SEMANTICS_BUCKET"
          args=()
          if [ "$SOURCE_REF" = refs/heads/main ]; then args+=(--promote); fi
          python tools/semantic_cards.py publish --bucket "$SEMANTICS_BUCKET" "${args[@]}"
