        action: validate
        automatic: true
      negotiation:
        allowedPaths:
        - /terms/initialCommissionBps
        - /terms/exclusive
  # Prices the customer’s selection against the current catalog revision.
  catalog:
    type:
      blueId: 9s5acB23ioD1ycnAVbpwfd5nmrKRTQuvo7cQJr2akW1R  # Commerce/Catalog Clause
    bindings:
      state: /products
  # Sets the commission rate on first activation.
  quoteCommission:
    type:
      blueId: 7KbJT4mN89aF6HAkuWSjw7sWmHn6PaKCJWWzSaAQEzo8  # Features/Feature Clause
    parameters:
      actions:
        initializeRate:
          do:
          - $appendChange:
              op: add
              path: /terms/commissionBps
              val:
                $document: /terms/initialCommissionBps
    bindings:
      initializeRate:
        firstActivation:
          'on': activated
          once: true
  # Prepares a separate Order and assigns it the current commission rate.
  orders:
    type:
      type:
        blueId: 3ZugrpKGtj7sCSdEcnLfCokUadLffFmWfKrepuzpo2cJ  # Documents/Documents Clause
      optionalBindings:
      - template
      - fulfilment
      bindingTypes:
        catalog: pointer
        fulfilment: pointer
    parameters:
      suppliedBy: partner
      suppliedParties:
      - customer
      customerRole: customer
      prepareFor: bootstrap
      obtain: provide
      preparationDefinition:
        type:
          blueId: FVMLYWpPnXjmtEdBmPvoWy5NQGmpGsoVcKsZhPZrfCvS  # Schedule/Order Preparation Functions
      selectBeforeActivation: true
      allowedFields:
