description: Book a two-hour bicycle rental with a helmet for an outing along the harbor.
products:
  revision: 1
  supplierId: seller
  currency: USD
  entries:
    harbor-bike:
      label: Harbor bicycle rental
      description: Two-hour bicycle rental with helmet for a harbor outing.
      pricingUnit: per_unit
      dateRequired: false
      unitAmountMinor: 8000
      guestDiscountPercent: 10
offer:
  title: Harbor Pedal Outing
  text: Book a two-hour bicycle rental with a helmet for an outing along the harbor.
  sections: []
clauses:
  # Sets the roles and approvals required for the current agreement terms.
  activation:
    type:
      blueId: 9QGLBqYRo7jsyf2ke13vgzpss1V8t2QrAumMwX8aUpmj  # Activation/Activation Clause
    parameters:
      parties:
        seller:
          type:
            blueId: BMz54jViTSnnyfhug3rnuD81or6AekswsVrwyV3ZXLid  # MyOS/MyOS Party
          business:
            type:
              blueId: 6oNfLaBHNpwcqPF75kTQ22KSbqStGEiPxwj5bBavL4VV  # Parties/Business
            displayName: Bay Signal Bikes
        partner:
          type:
            blueId: BMz54jViTSnnyfhug3rnuD81or6AekswsVrwyV3ZXLid  # MyOS/MyOS Party
          business:
            type:
              blueId: 6oNfLaBHNpwcqPF75kTQ22KSbqStGEiPxwj5bBavL4VV  # Parties/Business
            displayName: Tide Lantern Lodge
