  exclusive: false
  payoutOperator: stripe
  payoutFeePolicy: myos-commission-fee-v1
  payoutFeeBps: 2000
  payoutOperatorAccountId:
    type: Text
  initialCommissionBps: 1250
  type:
    initialCommissionBps:
      type: Integer
      schema:
        minimum: 0
        maximum: 10000
    commissionBps:
      type: Integer
