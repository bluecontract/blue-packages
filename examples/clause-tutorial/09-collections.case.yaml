document: 09-collections.blue
initial: {}
steps:
- operation: addInspection
  channel: owner
  request:
    key: a
    document:
      name: Inspection A
      changes: 0
      contracts:
        owner:
          type: Contracts/External Channel
          event:
            source: owner
        change:
          type: Contracts/Sequential Workflow Operation
          channel: owner
          steps:
          - type: Contracts/Compute
            do:
            - $appendChange:
                op: replace
                path: /changes
                val: 1
            - $appendEvent:
                family: Inspection
                kind: Updated
- operation: change
  channel: owner
  request: {}
  expect:
    /inspectionsEventsCount: 1
  target: /inspections/a
- operation: addReceipt
  channel: owner
  request:
    key: a
    document:
      name: Receipt A
      changes: 0
      contracts:
        owner:
          type: Contracts/External Channel
          event:
            source: owner
        change:
          type: Contracts/Sequential Workflow Operation
          channel: owner
          steps:
          - type: Contracts/Compute
            do:
            - $appendChange:
                op: replace
                path: /changes
                val: 1
            - $appendEvent:
                family: Receipt
                kind: Updated
- operation: change
  channel: owner
  request: {}
  expect:
    /receiptsEventsCount: 1
  target: /receipts/a
