document: 30-commission-a2a-payout.blue
initial:
  expect:
    /activation/active: false
steps:
- operation: approve_seller
  channel: seller
  request:
    revision: 1
  requireExactDocumentVersion: true
- operation: approve_partner
  channel: partner
  request:
    revision: 1
  requireExactDocumentVersion: true
- operation: startPayout
  label: Seller prepares G=1000; MyOS fee 20% freezes F=200 and the payout instruction amount N=800
  channel: seller
  request:
    key: p1
    amountMinor: 1000
  requireExactDocumentVersion: true
  expect:
    /commission/reserved: 1000
    /commission/paid: 0
- operation: startPayout
  label: An identical retry reuses the prepared payout instruction
  channel: seller
  request:
    key: p1
    amountMinor: 1000
  requireExactDocumentVersion: true
  expect:
    /commission/reserved: 1000
- operation: startPayout
  label: A client cannot supply the fee
  channel: seller
  request:
    key: p2
    amountMinor: 1000
    feeMinor: 0
  requireExactDocumentVersion: true
  status: FAILED
- operation: startPayout
  label: One unresolved payout at a time
  channel: seller
  request:
    key: p2
    amountMinor: 500
  requireExactDocumentVersion: true
  status: FAILED
