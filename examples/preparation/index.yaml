- file: 01-manual-reimbursement
  name: Reimburse an agreed expense
  story: Alice calls prepareDocument with requestId reimbursement. The reviewed manual PI is created and
    attached; ready means connected, not paid.
- file: 02-course-business-event
  name: Course enrollment starts payment
  story: Alice calls confirmPurchase. Its business event starts exactly one local payment preparation;
    replaying that request does not create another PI.
- file: 03-card-existing-parties
  name: Equipment purchase with a merchant-supplied payment
  story: Alice prepares the requirement. Bob initializes that exact PI, attaches the host to it, and provides
    the PI. Capture remains driven by the actual host state.
- file: 04-buyer-bank
  name: Buyer supplies a bank payment
  story: Alice provides her selected bank profile in preparation, obtains the exact PI, and calls provideDocument.
    The bank need not join the host for a one-way relation.
- file: 05-local-delivery
  name: Seller performs local delivery
  story: Alice requests delivery preparation. The agreement creates the shipment. A later shipment request
    and carrier confirmation remain separate operations.
- file: 06-buyer-collection
  name: Buyer supplies a collection document
  story: Alice obtains a shipment matching the frozen collection requirement and provides it. Identity
    and destination checks run before embedding.
- file: 07-carrier-cross-link
  name: Carrier waits for release of the goods
  story: Bob supplies the carrier document with a reciprocal host link. Dispatch is requested only when
    the host release condition is true.
- file: 08-local-work-order
  name: Work order
  story: Alice requests an inspection. The same preparation base creates an ordinary document with all
    host parties and its frozen task description.
- file: 09-provided-inspection
  name: Provider supplies the inspection work order
  story: Bob provides the initialized exact work order. An altered task or missing observer is rejected
    before it becomes an active embedded document.
- file: 10-deposit-and-balance
  name: Deposit and final balance are separate obligations
  story: Alice calls prepareDeposit and prepareBalance with separate request IDs. Each clause owns its
    own PI; replaying either preparation cannot create a third payment.
- file: 11-card-admit-guarantor
  name: Admit a new payment guarantor
  story: Bob provides the prepared PI. Alice and Bob approve its exact authority admission; valid read
    grants and fresh authority consent precede reciprocal attachment.
- file: 12-shipment-admit-carrier
  name: Admit a new carrier
  story: The same admission process accepts a carrier for a host-dependent shipment. No shipment is attached
    while the required admission or reverse link is missing.
