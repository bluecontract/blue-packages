document: 01-simple-payment.blue
initial:
  members: 2
  expect:
    /payment/policy/eligible: false
steps:
- target: /payment
  channel: customer
  operation: confirmSatisfaction
  expect:
    /payment/policy/eligible: true
- target: /payment
  channel: customer
  operation: confirmSatisfaction
  eventCount: 0
- target: /payment
  channel: guarantor
  operation: acceptPaymentInstruction
  echoTypes:
  - PaymentInstruction/Payment Instruction Accepted
- target: /payment
  channel: guarantor
  operation: recordTransactionInitiated
  request:
    transactionId: t1
  expect:
    /payment/payment/reserved/secure: 10000
  echoTypes:
  - PaymentInstruction/Transaction Initiated
- target: /payment
  channel: guarantor
  operation: secureFunds
  request:
    requestId: authorization-0
  expect:
    /payment/payment/reserved/capture: 10000
  echoTypes:
  - PaymentInstruction/Funds Secured
- target: /payment
  channel: guarantor
  operation: completePayment
  request:
    requestId: capture-0
  expect:
    /payment/payment/completed: 10000
    /payment/policy/status: Paid
  restore: true
  echoTypes:
  - PaymentInstruction/Payment Completed
