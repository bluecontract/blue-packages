document: 03-compensation.blue
steps:
- operation: startPayment
  channel: seller
  target: ''
- operation: deliver
  channel: carrier
  target: /delivery
- operation: acceptDelivery
  channel: customer
  target: ''
- operation: acceptPaymentInstruction
  channel: guarantor
  target: /payment
- operation: recordTransactionInitiated
  channel: guarantor
  target: /payment
  request:
    transactionId: comp-1
- operation: secureFunds
  channel: guarantor
  target: /payment
  request:
    requestId: authorization-0
  expect:
    /payment/payment/reserved/capture: 10000
- operation: reportOrderFailed
  channel: seller
  target: ''
  request:
    reason: customer-dispute
- operation: recordPaymentCompletionUnknown
  channel: guarantor
  target: /payment
  request:
    requestId: capture-0
    reason: Provider reported unknown
  expect:
    /payment/payment/reserved/capture: 10000
- operation: completePayment
  channel: guarantor
  target: /payment
  request:
    requestId: capture-0
  expect:
    /payment/payment/completed: 10000
    /payment/payment/reserved/refund: 0
    /payment/policy/failed: false
