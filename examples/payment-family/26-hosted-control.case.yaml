document: 01-simple-payment.blue
steps:
- operation: requestPaymentCompletionLock
  target: /payment
  channel: customer
  request:
    requestId: host-lock
    reason: Check delivery
  expect:
    /payment/payment/locks/capture: false
  echoTypes:
  - PaymentInstruction/Payment Completion Lock Requested
- operation: lockPaymentCompletion
  target: /payment
  channel: guarantor
  request:
    requestId: host-lock
  expect:
    /payment/payment/locks/capture: true
  echoTypes:
  - PaymentInstruction/Payment Completion Locked
  restore: true
