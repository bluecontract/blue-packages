document: 18-acme-bank.blue
initial:
  members: 2
  expect:
    /payment/policy/eligible: false
    /payment/paymentDetails/method: acme-bank
  events:
  - clause: payment
    kind: Bank Payment Instruction Created
steps:
- target: /payment
  channel: customer
  operation: confirmSatisfaction
  expect:
    /payment/policy/eligible: true
- target: /payment
  channel: customer
  operation: confirmSatisfaction
  eventCount: 0
- target: /payment
  channel: guarantor
  operation: acceptPaymentInstruction
- target: /payment
  channel: guarantor
  operation: recordTransactionInitiated
  request:
    transactionId: t1
  expect:
    /payment/payment/reserved/secure: 10000
  events:
  - clause: payment
    kind: Bank Execution Requested
    event:
      request:
        action: secure
        requestId: authorization-0
- target: /payment
  channel: guarantor
  operation: secureFunds
  request:
    requestId: authorization-0
  expect:
    /payment/payment/reserved/capture: 10000
- target: /payment
  channel: guarantor
  operation: completePayment
  request:
    requestId: capture-0
  expect:
    /payment/payment/completed: 10000
    /payment/policy/status: Paid
  restore: true
