document: 03-compensation.blue
initial: {}
steps:
- operation: startPayment
  channel: seller
  target: ''
- operation: deliver
  channel: carrier
  target: /delivery
- operation: acceptDelivery
  channel: customer
  target: ''
- operation: acceptPaymentInstruction
  channel: guarantor
  target: /payment
- operation: recordTransactionInitiated
  channel: guarantor
  target: /payment
  request:
    transactionId: comp-1
- operation: secureFunds
  channel: guarantor
  target: /payment
  request:
    requestId: authorization-0
  expect:
    /payment/payment/reserved/capture: 10000
- operation: reportOrderFailed
  channel: seller
  target: ''
  request:
    reason: abc
  expect:
    /status: Failed
    /payment/policy/failed: true
    /payment/payment/reserved/refund: 0
- operation: recordPaymentCompletionUnknown
  channel: guarantor
  target: /payment
  request:
    requestId: capture-0
    reason: Provider reported unknown
  expect:
    /payment/payment/reserved/capture: 10000
- operation: completePayment
  channel: guarantor
  target: /payment
  request:
    requestId: capture-0
  expect:
    /payment/payment/completed: 10000
    /payment/payment/reserved/refund: 10000
    /status: Failed
- operation: reverseAfterCompletion
  channel: guarantor
  target: /payment
  request:
    requestId: compensate-10000-0-0
  expect:
    /payment/payment/reversed: 10000
    /financial/net: 0
    /payment/policy/status: Compensated
    /status: Failed
  restore: true
