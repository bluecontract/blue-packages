documentId: sdk-counter
counter: 0
contracts:
  ownerChannel:
    type: Coordination/Timeline Channel
    timeline:
      type: MyOS/MyOS Timeline
      timelineId: sdk/counter/alice
    actor:
      type: MyOS/Principal Actor
      accountId: alice
  increment:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request:
      amount: {type: Integer}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /counter
              val:
                $add:
                  - $document: /counter
                  - $binding: event/message/request/amount
          - $return: true
  decrement:
    type: Coordination/Sequential Workflow Operation
    channel: ownerChannel
    request:
      amount: {type: Integer}
    steps:
      - type: Coordination/Compute
        do:
          - $appendChange:
              op: replace
              path: /counter
              val:
                $subtract:
                  - $document: /counter
                  - $binding: event/message/request/amount
          - $return: true
